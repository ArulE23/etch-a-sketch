<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css"/>
    <title>Etch-A-Sketch</title>
  </head>
  <body>
    <div id="main-container">
      <h1>Etch-A-Sketch</h1>
      <div id="sketch-grid">
      </div>
      <div id="bottom-section">
        <div class="dial left-dial"></div>
        <div id="btns-container">
          <div id="size-btns">
            <button id="size-s" class="clicked">Small</button>
            <button id="size-m">Medium</button>
            <button id="size-l">Large</button>
          </div>
          <div id="colour-btns">
            <input type="color" id="solid-clr" name="solid-clr" value="#1e1e1e" />
            <button id="solid-btn" class="clicked">Solid</button>
            <button id="rainbow-btn">Rainbow</button>
          </div>
          <div>
            <button id="sketch-btn">Sketch Mode</button>
          </div>
          <div>
            <button id="clear-btn">Clear</button>
          </div>
        </div>
        <div class="dial right-dial"></div>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
